<div class="row">
    <div class="col-md-12">
        <div class="white-box">
            <h3 class="box-title">Öçür Fakultetlar</h3> </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="white-box p-0">
            <!-- .left-right-aside-column-->
            <div class="page-aside">
                <div class="right-aside">
                    <div class="right-page-header">
                      <h3>Fakultetler </h3>
                      <div class="pull-right">
                          <input type="text" id="demo-input-search2" placeholder="gözlemek" class="form-control" [(ngModel)]="search">
                      </div>
                      </div>
                    <div class="clearfix"></div>
                    <div class="scrollable">
                        <div class="table-responsive">
                            <table id="demo-foo-addrow" class="table m-t-30 table-hover contact-list" data-page-size="10">
                                <thead>
                                    <tr>
                                        <th>№</th>
                                        <th>Ady</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let i of faculties; let ind = index" [style]="isSearch(i.name)?'':'display: none'">
                                        <td>{{ind+1}}</td>
                                        <td>
                                            {{i.name}}
                                        </td>
                                        <td>
                                            <!-- <button (click)="modalDelete = true; checkId = i.id" class="btn btn-block btn-danger">Öçür</button> -->
                                            <button (click)="deleteFaculty(i.id)" class="btn btn-block btn-danger">Öçür</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <!-- .left-aside-column-->
            </div>
            <!-- /.left-right-aside-column-->
        </div>
    </div>
</div>
