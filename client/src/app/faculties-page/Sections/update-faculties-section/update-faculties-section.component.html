<div class="row">
    <div class="col-md-12">
        <div class="white-box">
            <h3 class="box-title">Üýtgetmek Faculties</h3> </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="white-box p-0">
            <!-- .left-right-aside-column-->
            <div class="page-aside">
                <div class="right-aside">
                    <div class="right-page-header">
                      <h3>Fakultetler </h3>
                      <div class="pull-right">
                          <input type="text" id="demo-input-search2" placeholder="gözlemek" class="form-control" [(ngModel)]="search">
                      </div>
                      </div>
                    <div class="clearfix"></div>
                    <div class="scrollable">
                        <div class="table-responsive">
                            <table id="demo-foo-addrow" class="table m-t-30 table-hover contact-list" data-page-size="10">
                                <thead>
                                    <tr>
                                        <th>№</th>
                                        <th>Ady</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let i of faculties; let ind = index" [style]="isSearch(i.name)?'':'display: none'">
                                        <td>{{ind+1}}</td>
                                        <td>
                                            {{i.name}}
                                        </td>
                                        <td>
                                            <button (click)="checkObj(i)" class="btn btn-block btn-warning">Täzelen</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <!-- .left-aside-column-->
            </div>
            <!-- /.left-right-aside-column-->
        </div>
    </div>
</div>

<div id="responsive-modal" class="modal fade in" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" [style]="modalUpdate?'display: block; padding-right: 15px;':'display: none; padding-right: 15px;'">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button (click)="modalUpdate = false" type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
                <h4 class="modal-title">Fakultet täzelenmesi</h4> </div>
            <div class="modal-body">
                <div>
                    <div class="form-group">
                        <label for="recipient-name" class="control-label">Ady:</label>
                        <input type="text" class="form-control" id="recipient-name" [(ngModel)]="name">
                      </div>
                  </div>
            </div>
            <div class="modal-footer">
                <button (click)="modalUpdate = false" type="button" class="btn btn-default waves-effect" data-dismiss="modal">Ýapyň</button>
                <button (click)="modalUpdate = false; putFaculty()" type="button" class="btn btn-danger waves-effect waves-light">Üýtgetmeleri ýatda sakla</button>
            </div>
        </div>
    </div>
</div>
