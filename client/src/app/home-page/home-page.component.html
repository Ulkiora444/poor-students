<div id="wrapper">

    <app-nav></app-nav>

    <div id="page-wrapper" style="min-height: 880px;">
        <div class="container-fluid">
            <div class="row bg-title">
                <div class="col-lg-3 col-md-4 col-sm-4 col-xs-12">
                    <h4 class="page-title">Baş sahypa</h4> 
                </div>
                <div *ngIf="getIndexNavHomeRouter()==-1" class="col-lg-9 col-sm-8 col-md-8 col-xs-12">
                    <a (click)="deleteAll()" class="btn btn-danger pull-right m-l-20 hidden-xs hidden-sm waves-effect waves-light">täzeden düzmek</a>
                </div>
                <div *ngIf="getIndexNavHomeRouter()!=-1" class="col-lg-9 col-sm-8 col-md-8 col-xs-12">
                    <a (click)="setIndexNavHomeRouter(-1)" class="btn btn-danger pull-right m-l-20 hidden-xs hidden-sm waves-effect waves-light">Ýap</a>
                </div>            
            </div>
            <app-home-section *ngIf="getIndexNavHomeRouter()==-1"></app-home-section>
            <app-print-home-section *ngIf="getIndexNavHomeRouter()==0"></app-print-home-section>
            <app-save-home-section *ngIf="getIndexNavHomeRouter()==1"></app-save-home-section>
            <app-export-home-section *ngIf="getIndexNavHomeRouter()==2"></app-export-home-section>
            <app-journal-home-section *ngIf="getIndexNavHomeRouter()==3"></app-journal-home-section>
        </div>
    </div>
    
</div>
