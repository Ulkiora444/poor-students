<div class="col-lg-12">
    <div class="white-box">
        <h3 class="box-title">Žurnal</h3>

        <div class="page-aside">
            <div class="right-aside">
              <div class="row">
                <div class="col-sm-12 col-xs-12">
                    <div>
                        <div class="form-group">
                          <label class="exampleInputEmail1">Saýlamak žurnal</label>
                          <div class="exampleInputEmail1">
                              <select (change)="changeJournal()" [(ngModel)]="groupsId" class="form-control">
                                <option [value]="-1" style="display: none;" disabled>Saýlamak</option>
                                <option [value]="group.id" *ngFor="let group of groups">{{group.course}} {{group.name}}</option>
                              </select>
                          </div>
                        </div>
                        <!-- <button type="submit" class="btn btn-success waves-effect waves-light m-r-10">Iber</button> -->
                      </div >
                </div>
            </div>
            </div>
              <!-- .left-aside-column-->
          </div>

        <div id="editable-datatable_wrapper" class="dataTables_wrapper form-inline dt-bootstrap">
        <div class="row">
            <div class="col-sm-12" style="overflow: auto; height: 500px;">
              <table class="table table-striped table-bordered dataTable" id="editable-datatable" style="cursor: pointer;" role="grid" aria-describedby="editable-datatable_info">
            <thead *ngIf="journal && journal.header_journal">
              <tr>
                <th style="width: 0px;">#</th>
                <th class="sorting" tabindex="0" aria-controls="editable-datatable" rowspan="1" colspan="1" style="width: 260.667px;">F. A. Aa.</th>
                <th class="sorting" tabindex="0" aria-controls="editable-datatable" rowspan="1" colspan="3" style="width: 344.667px;" *ngFor="let i of journal.header_journal">{{i.subjects.name}}</th>
                <th class="sorting" tabindex="0" aria-controls="editable-datatable" rowspan="1" colspan="1" style="width: 0px;">Ortacha baha</th>
              </tr>
            </thead>
            <tbody *ngIf="journal && journal.journal">
                <tr id="8" class="gradeA even" role="row" *ngFor="let i of journal.journal; let rowIndex = index">
                  <td>{{rowIndex+1}}</td>
                  <td tabindex="1" class="sorting_1">{{i.name}}</td>
                  <ng-container *ngFor="let j of journal.header_journal; let colIndex = index">
                    <!-- <td tabindex="1" class="center cl-tb" (click)="openModal(j.teachers, j.subjects, i.id, j.id, getRating(j.teachers.id, i.ratings, 1), 1)">{{getRating(j.teachers.id, i.ratings, 1).rating}}</td>
                    <td tabindex="1" class="center cl-tb" (click)="openModal(j.teachers, j.subjects, i.id, j.id, getRating(j.teachers.id, i.ratings, 2), 2)">{{getRating(j.teachers.id, i.ratings, 2).rating}}</td>
                    <td tabindex="1" class="center cl-tb" (click)="openModal(j.teachers, j.subjects, i.id, j.id, getRating(j.teachers.id, i.ratings, 3), 3)">{{getRating(j.teachers.id, i.ratings, 3).rating}}</td> -->

                    <td tabindex="1" class="center cl-tb"><input (input)="openModal(j.teachers, j.subjects, i.id, j.id, getRating(j.teachers.id, i.ratings, 1), 1); onInput($event, getRating(j.teachers.id, i.ratings, 1))" (keydown)="onKeydown($event); allowOnlySpecificDigits($event)" [attr.data-row]="rowIndex" [attr.data-col]="colIndex * 3+ 1" [ngModel]="getRating(j.teachers.id, i.ratings, 1).rating" type="text" [maxLength]="2" ></td>
                    <td tabindex="1" class="center cl-tb"><input (input)="openModal(j.teachers, j.subjects, i.id, j.id, getRating(j.teachers.id, i.ratings, 2), 2); onInput($event, getRating(j.teachers.id, i.ratings, 2))" (keydown)="onKeydown($event); allowOnlySpecificDigits($event)" [attr.data-row]="rowIndex" [attr.data-col]="colIndex * 3+ 2" [ngModel]="getRating(j.teachers.id, i.ratings, 2).rating" type="text" [maxLength]="2" ></td>
                    <td tabindex="1" class="center cl-tb"><input (input)="openModal(j.teachers, j.subjects, i.id, j.id, getRating(j.teachers.id, i.ratings, 3), 3); onInput($event, getRating(j.teachers.id, i.ratings, 3))" (keydown)="onKeydown($event); allowOnlySpecificDigits($event)" [attr.data-row]="rowIndex" [attr.data-col]="colIndex * 3+ 3" [ngModel]="getRating(j.teachers.id, i.ratings, 3).rating" type="text" [maxLength]="2" ></td>
                  </ng-container>
                  <td class="center" tabindex="1">{{getTotal(i.ratings)}}</td>
                </tr>
            </tbody>
            <tfoot *ngIf="journal && journal.header_journal">
              <tr role="row">
                <th class="sorting" tabindex="0" aria-controls="editable-datatable" rowspan="1" colspan="2">Mugallymy</th>
                <th class="sorting" tabindex="0" aria-controls="editable-datatable" rowspan="1" colspan="3" style="width: 344.667px;" *ngFor="let i of journal.header_journal">{{i.teachers.name}}</th>
                <th class="sorting" tabindex="0" aria-controls="editable-datatable" rowspan="1" colspan="1"></th>  
              </tr>
            </tfoot>
        </table>
    </div>
</div>


<div *ngIf="isModalUpdate" id="responsive-modal" class="modal fade in" style="display: block; padding-right: 15px;">
  <div class="shadow-block"></div>
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header">
              <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="isModalUpdate = false">×</button>
              <h4 class="modal-title">{{obj_update.teacher}} ({{obj_update.subject}} {{obj_update.part}})</h4> </div>
          <div class="modal-body">
              <div class="form">
                  <div class="form-group my-form-group">
                    <label class="control-label">Baha</label>
                    <div>
                        <select [(ngModel)]="obj_update.rating" class="form-control my-form-control">
                          <option [value]="-1">-</option>
                          <option [value]="i" *ngFor="let i of ratingMas">{{i}}</option>
                        </select>
                    </div>
                  </div>
                </div>
          </div>
          <div class="modal-footer">
              <button type="button" class="btn btn-default waves-effect" data-dismiss="modal" (click)="isModalUpdate = false">Ýap</button>
              <button type="button" class="btn btn-danger waves-effect waves-light" (click)="queryRating(); isModalUpdate = false">Üýtgeşmeleri ýatda saklaň</button>
          </div>
      </div>
  </div>
</div>
