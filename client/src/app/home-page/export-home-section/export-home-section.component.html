<div class="col-lg-12">
    <div class="white-box">
        <h3 class="box-title">Eksport Žurnal</h3>

        <div class="page-aside">
            <div class="right-aside">
                <div class="row">
                    <div class="col-sm-12 col-xs-12">
                        <div>
                            <div class="form-group">
                                <label class="exampleInputEmail1">Saýlamak Žurnal</label>
                                <div class="exampleInputEmail1">
                                    <select (change)="changedJournal = []" [(ngModel)]="indexCheckExport" class="form-control">
                                        <option [value]="0">Hemesi</option>
                                        <option [value]="1">Saýlamak žurnal indeks</option>
                                        <option [value]="2">Saýlamak žurnal</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group" *ngIf="indexCheckExport==1">
                                <label>Saýlamak žurnal indeks</label>
                                <input (input)="inputJournal()" [(ngModel)]="index_journals" type="text" class="form-control" placeholder="Saýlamak indeks Žurnal 1, 2, 3, 4 or  1 2 3 4 5">
                            </div>

                            <button type="submit" class="btn btn-success waves-effect waves-light m-r-10" (click)="getExport()">Iber</button>
                        </div >
                    </div>
                </div>
            </div>
              <!-- .left-aside-column-->
        </div>

        <div class="table-responsive manage-table">
            <table class="table" cellspacing="14">
                <thead>
                    <tr>
                        <th></th>
                        <th>#</th>
                        <th width="150">Ady</th>
                        <th>Kurs</th>
                    </tr>
                </thead>
                <tbody *ngIf="indexCheckExport!=2">
                    <tr *ngFor="let i of groups; let ind = index" [class]="isChangedJournal(ind+1)?'advance-table-row active':'advance-table-row'">
                        <td width="10"></td>
                        <td>{{ind+1}}</td>
                        <td>{{i.course}}</td>
                        <td>{{i.name}}</td>
                    </tr>
                </tbody>
                <tbody *ngIf="indexCheckExport==2">
                    <tr *ngFor="let i of groups; let ind = index" (click)="checkJournal(ind+1)" [class]="isChangedJournal(ind+1)?'advance-table-row active':'advance-table-row'">
                        <td width="10"></td>
                        <td>{{ind+1}}</td>
                        <td>{{i.course}}</td>
                        <td>{{i.name}}</td>
                    </tr>   
                </tbody>
            </table>
        </div>


    </div>
</div>
