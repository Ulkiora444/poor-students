<div class="row">
    <div class="col-md-12">
        <div class="white-box">
            <h3 class="box-title">Dörediň Dersleri</h3> 
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="white-box p-0">
            <!-- .left-right-aside-column-->
            <div class="page-aside">
              <div class="right-aside">
                <div class="row">
                  <div class="col-sm-12 col-xs-12">
                      <div>
                          <div class="form-group">
                              <label for="exampleInputEmail1">Dersi ady</label>
                              <input [(ngModel)]="name" type="text" class="form-control" id="exampleInputEmail1" placeholder="Dersi adyny giriziň">
                          </div>

                          <div class="form-group">
                            <label class="exampleInputEmail1">Kafedra</label>
                            <div class="exampleInputEmail1">
                                <select [(ngModel)]="departmentsId" class="form-control">
                                  <option value="-1" style="display: none;" disabled>Saýlamak kafedra</option>
                                  <option [value]="i.id" *ngFor="let i of departments">{{i.name}}</option>
                                </select>
                            </div>
                          </div>


                          <div class="form-group">
                            <label class="exampleInputEmail1">Kafedra müdiri</label>
                            <div class="exampleInputEmail1">
                                <select [(ngModel)]="teachersId" class="form-control">
                                  <option value="-1" style="display: none;" disabled>Saýlamak kafedra müdiri</option>
                                  <option [value]="i.id" *ngFor="let i of teachers">{{i.name}}</option>
                                </select>
                            </div>
                          </div>

                          <button (click)="postSubject()" type="submit" class="btn btn-success waves-effect waves-light m-r-10">Iber</button>
                        </div >
                  </div>
              </div>
            </div>
            <!-- .left-aside-column-->
        </div>
        <!-- /.left-right-aside-column-->
    </div>
</div>
</div>
